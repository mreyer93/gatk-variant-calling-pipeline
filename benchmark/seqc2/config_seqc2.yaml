# call_bam_GATK config for the SEQC2 HCC1395 exome benchmark (manual/benchmark.md).
# Replace the three placeholders first, e.g.
#   sed -e 's|<SEQC2_DIR>|/data/seqc2|' -e 's|<REFERENCE_DIR>|/data/references|' \
#       -e 's|<OUTPUT_DIR>|/data/seqc2_run|' benchmark/seqc2/config_seqc2.yaml > config_seqc2.yaml
#   sed 's|<SEQC2_DIR>|/data/seqc2|' benchmark/seqc2/bam_metadata.tsv > /data/seqc2/bam_metadata.tsv
# <SEQC2_DIR> is the directory benchmark/seqc2/download_seqc2.sh filled; <REFERENCE_DIR> is
# the one scripts/download_references.sh filled. Only the somatic calls are needed, so
# annotation, FACETS and the report are off; performance keys keep their defaults.
project_name: "HCC1395 whole exome, SEQC2 (Illumina centre)"
output_directory: "<OUTPUT_DIR>"
bam_metadata: "<SEQC2_DIR>/bam_metadata.tsv"
annotation_only: False
skip_bqsr: False
skip_annotation: True
call_tumor_normal: True
run_facets: False
filter_min_af: 0.02
filter_min_dp: 5
filter_GATK: ['PASS', 'normal_artifact']
filter_min_cadd: 20
target_bed_w100: "<SEQC2_DIR>/V6_UTR_w100.bed"
genome_version: "GRCh38"
REF_FILE: "<REFERENCE_DIR>/Homo_sapiens_assembly38.fasta"
funcotator_data_path: "not_used"
dbsnp_file: "<REFERENCE_DIR>/dbsnp/Homo_sapiens_assembly38.dbsnp138.vcf"
dbsnp_common_file: "<REFERENCE_DIR>/dbsnp/00-common_all.GRCh38.b151.vcf.gz"
gnomad_file: "<REFERENCE_DIR>/af-only-gnomad.hg38.vcf.gz"
make_report: False

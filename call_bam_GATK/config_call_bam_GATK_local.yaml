# Local-machine config for the somatic pipeline: skips CADD + Funcotator + the whole
# annotation/scoring stage entirely (skip_annotation: True below).
#
# Why not substitute AlphaMissense here like the germline local config does: the somatic
# "new score" ranking (CADD score * mean tumor AF * log2 fold change) and its filtering
# require a deleteriousness score on every variant type - AlphaMissense only scores
# missense SNVs, so swapping it in here would silently drop all indel/nonsense/splice
# calls from the "filtered"/scored output, which are often the clinically important
# calls in a cancer gene panel. That's a worse outcome than just skipping scoring
# locally. See manual/somatic.md.
#
# With skip_annotation: True you still get: BQSR, Mutect2 tumor-vs-reference and
# tumor-vs-normal calling, orientation-bias/contamination filtering, and FACETS CNA/LOH -
# just not CADD/Funcotator annotation or the "new score" ranking. Run the full pipeline
# (config_call_bam_GATK.yaml) on the cloud VM for that.
#
# Note: funcotator_data_path/dbsnp/gnomad below still need *some* value even though
# they're unused in this mode - Snakemake evaluates all rules' params at parse time,
# so a missing key is a hard error even for a rule that's never actually run.

output_directory: 'output'
annotation_only: False
bam_metadata: 'bam_metadata.tsv'

skip_annotation: True

# unused when skip_annotation is True, but must still be present (see note above)
filter_min_af: 0.02
filter_min_dp: 5
filter_GATK: ['PASS', 'normal_artifact']
filter_min_cadd: 20
funcotator_data_path: 'not_used'

################################################################################
### REFERENCES AND DATABASES ###################################################
################################################################################
# REQUIRED: path to a BED file of this project's capture-panel targets, +/- 100bp, in GRCh38 coordinates
target_bed_w100: '/path/to/your/targets_w100_hg38.bed'
genome_version: "GRCh38"
# Broad resource bundle: gs://gcp-public-data--broad-references/hg38/v0/Homo_sapiens_assembly38.fasta
REF_FILE: '/path/to/data/references/Homo_sapiens_assembly38.fasta'
# Broad resource bundle: Homo_sapiens_assembly38.dbsnp138.vcf
dbsnp_file: '/path/to/data/references/dbsnp/Homo_sapiens_assembly38.dbsnp138.vcf.gz'
# GATK best-practices somatic-hg38 bundle: small_exac_common_3.hg38.vcf.gz
dbsnp_common_file: '/path/to/data/references/dbsnp/small_exac_common_3.hg38.vcf.gz'
# GATK best-practices somatic-hg38 bundle: af-only-gnomad.hg38.vcf.gz - still needed,
# this is used as the Mutect2 --germline-resource, not just for CADD/annotation
gnomad_file: '/path/to/data/references/af-only-gnomad.hg38.vcf.gz'

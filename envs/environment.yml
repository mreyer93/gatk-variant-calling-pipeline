# Conda/mamba environment for the variant-calling and read-processing pipelines.
# Create with: mamba env create -f envs/environment.yml -n gatk-pipeline
#
# Versions below were current as of mid-2026 (GATK 4.6.2, samtools/bcftools/htslib
# 1.23). Re-check with `mamba search <pkg>` periodically and bump as needed -
# these are pinned for reproducibility, not frozen forever.
name: gatk-pipeline
channels:
  - r
  - conda-forge
  - bioconda
dependencies:
  # FACETS (snp-pileup, r-facets) lives in envs/facets.yml: snp-pileup is built for
  # Linux only on bioconda, so listing it here made this env uninstallable on any Mac.
  - bcftools=1.23
  - bedtools
  - bwa>=0.7.17
  - cadd-scripts
  - fastqc
  - gatk4=4.6.2
  - htslib=1.23
  - multiqc
  - pandas
  - picard>=3.1
  - r-base
  - r-dplyr      # smooth_depth.R; used but never declared (found on a clean env)
  - r-ggplot2
  - r-knitr
  - r-reshape2
  - r-rmarkdown
  - samtools=1.23
  # Snakemake made significant CLI/workflow changes across major versions (7 -> 8 -> 9).
  # Pinned to the 7.x line, which this pipeline has been verified against with a dry-run
  # (snakemake -n) of both call_bam_GATK snakefiles and the process_reads snakefile.
  # Bumping to 8.x/9.x should work for these fairly basic rule/script/conda-directive
  # Snakefiles, but re-run a dry-run to confirm before relying on it.
  - snakemake>=7.32,<8
  - trim-galore

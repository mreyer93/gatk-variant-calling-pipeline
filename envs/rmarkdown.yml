# Used for the per-rule `conda:` directives in process_reads (e.g. the primer_check
# QC report). The old pins here (r-tidyr=1.1.2, r-broom=0.7.4, r-tibble=3.0.6,
# icu=58) were just whatever was installed in 2021 rather than a documented
# compatibility requirement, and icu=58 in particular is old enough to be hard to
# solve against current conda-forge builds - relaxed to unpinned/current.
name: rmarkdown
channels:
  - r
  - conda-forge
dependencies:
  - r-rmarkdown
  - r-data.table
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-ggsci
  - r-ggforce
  - r-ggpubr
  - r-knitr
  - r-broom
  - r-tibble
  - pandoc
  - nbformat
  - r-reshape2
  - tectonic
